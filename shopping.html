<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0; margin: 0;
        }
        .nav-bar{
              display: flex;
              justify-content: space-between;
              align-items: center;
              background-color: #E7B8BA;
              color: black;
              height: 75px;
              margin-bottom: 15px;
        }
        .right{
            display: flex;
           
            width: 30%;
            justify-content: space-evenly;
        }
        .hero-section{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            height: 190px;
            /* border: 2px solid red; */
            flex-direction: column; 
            background-color: #E7B8BA;
            color:black; 
           
        }
        button{
            height: 20px;
            padding: 3px;
            background-color: deeppink;
            border: none;
            font-weight: bolder;
            border-radius: 10px;

        }
        .products{
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            margin-top: 30px;

        }
        img{
            height: 200px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 0 10px black;
            padding: 6px;
            transition: all 1s;

        }
        img:hover{
            transform: scale(1.1);
        }

            
        
        .footer{
            display: flex;
            justify-content: space-between;
            /* align-items: center; */
            background-color: #E7B8BA;
            padding: 20px;
            margin-top: 40px;
            height: 150px;
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="left">
            <h2>Logo</h2>
        </div>
        <div class="right">
            <h2>Signup</h2>
            <h2>Login</h2>
        </div>
    </div>
    <!-- HERO SECTION-->
  <div class="hero-section">
           
    <h1>welcom to <span style="color: deeppink;">Shopify....🛍️</span></h1>
    <button>shop now</button>
  </div>
  <center style="margin-top: 30px;"><h1>Products</h1></center>
  <div class="products">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSYatIcVn8INpbxrCcjS9izebrxcs_jCJIRJ8EwlBSzTA&s=10" alt="">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxFStBNw2LPyeqLM0tjdcFBJ2c0ENBbQ-7SLuYAL7Q5w&s=10" alt="">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuLE0eypI5ZYBselMOIF3bnKTIak5GZ72ydIJ_v9OoXg&s=10" alt="">
  </div>
  <div class="products">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdxnEX59lVE2H8qyLGQmpcIqxWd8qFHgl0u_myOBn5jw&s=10" alt="">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRZoEHPSCAl2eNS3WRGhIKFveNOA2PeNkvKFttzB8xB_w&s=10" alt="">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTsMPQBP-ZwDjwrN0WMCcl8_cVAe-J_EATUNpNp0Eh_9A&s=10" alt="">
  </div>
  <!-- footer -->
   <div class="footer">
    <div class="site">
        <h2>Shopify</h2>
    </div>
    <div class="categories">
        <h2>Catedgories</h2>
        <ul>
            <li>Electronics</li>
            <li>Furnitures</li>
            <li>Fashions</li>
            <li>Kitchen</li>
        </ul>
    </div>
    <div class="address">
        <h2>Address</h2>
        <p><b>+91 1234567890</b></p>
        <p><b>Bengaluru,KA</b></p>
    </div>
   </div>
</body>
</html>
